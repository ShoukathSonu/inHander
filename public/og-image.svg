<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Subtle Grid Lines -->
  <defs>
    <radialGradient id="grad1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad3" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Atmospheric Mesh Orbs -->
  <rect width="1200" height="630" fill="url(#grad1)"/>
  <rect width="1200" height="630" fill="url(#grad2)"/>
  <rect width="1200" height="630" fill="url(#grad3)"/>

  <!-- Brand Badge -->
  <g transform="translate(100, 100)">
    <rect width="48" height="48" rx="12" fill="#ffffff"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#0a0a0a" text-anchor="middle">₹</text>
    <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.5">In Hand Salary</text>
    <text x="260" y="32" font-family="monospace" font-size="16" font-weight="500" fill="#888888">inHander.com</text>
    <rect x="400" y="14" width="160" height="26" rx="13" fill="#181818" stroke="#333333"/>
    <text x="480" y="31" font-family="monospace" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">FY 2025-26 &amp; 26-27</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 240)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-2">
      Calculate Your In Hand Salary.
    </text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#a1a1a1">
      The developer-grade Indian salary calculator &amp; tax optimizer.
    </text>
  </g>

  <!-- Metric Highlights Pills -->
  <g transform="translate(100, 420)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="310" height="110" rx="16" fill="#141414" stroke="#262626"/>
    <text x="24" y="38" font-family="monospace" font-size="12" font-weight="600" fill="#888888" letter-spacing="1">NEW TAX REGIME</text>
    <text x="24" y="78" font-family="monospace" font-size="28" font-weight="700" fill="#10b981">₹7.75L Tax-Free</text>

    <!-- Card 2 -->
    <rect x="340" y="0" width="310" height="110" rx="16" fill="#141414" stroke="#262626"/>
    <text x="364" y="38" font-family="monospace" font-size="12" font-weight="600" fill="#888888" letter-spacing="1">DUAL TAX ENGINE</text>
    <text x="364" y="78" font-family="monospace" font-size="28" font-weight="700" fill="#0070f3">New vs Old Slabs</text>

    <!-- Card 3 -->
    <rect x="680" y="0" width="310" height="110" rx="16" fill="#141414" stroke="#262626"/>
    <text x="704" y="38" font-family="monospace" font-size="12" font-weight="600" fill="#888888" letter-spacing="1">CLIENT-SIDE PRIVACY</text>
    <text x="704" y="78" font-family="monospace" font-size="28" font-weight="700" fill="#ffffff">100% Private</text>
  </g>
</svg>
